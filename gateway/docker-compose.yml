name: shared-gateway

# Not bound to host port 80/443 by default — this host may already have something else
# answering there, and claiming 443 for real HTTPS needs a real domain pointed at this
# host first. Both are infrastructure decisions to make deliberately, not something a
# script should assume — see README.md "Going live" for options. Until then, this gateway
# works fine on the alternate port below.
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "8888:80"
    volumes:
      - ./Caddyfile:/etc/caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddyfile"]
    extra_hosts:
      # Standard Linux Docker doesn't provide host.docker.internal automatically (that's a
      # Docker Desktop convenience) — this is the documented way to get the same behavior
      # on a plain Linux host, letting the Caddyfile reach each app's own published port.
      - "host.docker.internal:host-gateway"
