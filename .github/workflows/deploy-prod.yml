name: Reusable deploy

# Generic reusable deployment workflow: checks out a tagged release on a
# self-hosted runner, optionally writes a .env file from a secret, runs a
# deploy script, and records the deployed version. Each calling repo's own
# workflow file supplies the runner label, checkout path, and secrets —
# this file has no project-specific details in it.
#
# Input/secret names use underscores, not hyphens: `${{ inputs.runner-label }}`
# parses as `inputs.runner - label` (subtraction) in GitHub Actions'
# expression syntax, silently invalidating the whole file.
#
# `secrets` is also not a recognized named-value inside a step-level `if:`
# in a reusable (called) workflow — only inside `run:` bodies and `env:`
# blocks. An `if: ${{ secrets.env_file != '' }}` guard here previously
# failed static validation on every single call, invalidating the whole
# file the same way a syntax error would (found via a manual
# workflow_dispatch test, which surfaces the real validation error —
# unlike a tag push, which just silently produces a job-less run). Fixed
# by moving the "was a value even provided" check into the shell step
# itself via an `env:`-mapped variable, never referencing `secrets` from
# an `if:`.

on:
  workflow_call:
    inputs:
      runner_label:
        description: The self-hosted runner label to run this job on
        required: true
        type: string
      project_path:
        description: >
          Full path to the project's checkout on the runner, e.g. "~/myapp"
          or an absolute path for a non-home-relative checkout. Bash
          tilde-expands "~" normally, so either form works.
        required: true
        type: string
      deploy_script:
        description: Path to the deploy script, relative to project_path
        required: false
        type: string
        default: scripts/deploy-prod.sh
      compose_file:
        description: Compose file to show in the run summary's status check
        required: false
        type: string
        default: docker-compose.prod.yml
    secrets:
      env_file:
        description: >
          Full contents to write to the project's .env file, one VAR=value
          per line — composed by the caller from its own repo secrets.
          Optional: omit entirely if the project has no runtime .env.
        required: false

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    steps:
      - name: Sync checkout to this release
        run: |
          cd ${{ inputs.project_path }}
          git fetch origin --tags --force
          git checkout --force "${{ github.ref_name }}"

      - name: Write environment file from secrets
        env:
          ENV_FILE_CONTENT: ${{ secrets.env_file }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf '%s\n' "$ENV_FILE_CONTENT" > ${{ inputs.project_path }}/.env
            chmod 600 ${{ inputs.project_path }}/.env
          fi

      - name: Deploy
        run: ${{ inputs.project_path }}/${{ inputs.deploy_script }}

      - name: Record deployed version
        if: success()
        run: echo "${{ github.ref_name }}" > ${{ inputs.project_path }}/.deployed-version

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ github.ref_name }} — ${{ inputs.project_path }}"
            echo "- Commit: \`$(git -C ${{ inputs.project_path }} rev-parse HEAD)\`"
            echo "- Status: ${{ job.status }}"
            echo ""
            echo '```'
            cd ${{ inputs.project_path }} && docker compose -f ${{ inputs.compose_file }} ps 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
